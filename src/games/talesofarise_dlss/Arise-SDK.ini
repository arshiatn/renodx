; Arise-SDK settings (https://www.nexusmods.com/talesofarise/mods/5), next to "Tales of Arise.exe".
; The RenoDX DLSS addon changes most of these live (Graphics > Arise-SDK's settings).

[Graphics]
; How far NPCs stay before they fade out (the game: about 2500-4000). -1: off (the addon's NPC distance then works).
MinimumNPCDistance = -1
; Monster spawn distance, times the game's (1).
MonsterDistanceMultiplier = 1
; NPC / monster detail distance, times the game's (1). -1: always full detail.
CharaLODMultiplier = 1
; Never hide characters (their sounds keep playing too). Costs a lot of FPS. Applies after reloading the map.
CharaDisableCull = false
; Full-rate animation for distant characters (sets a.URO.Enable 0).
DisableUpdateRateOptimization = false
; The game's two sharpen filters (the game: 0.5 / 1). -1: the game's, 0: off.
OverrideCharaSharpenFilterStrength = -1
OverrideStageSharpenFilterStrength = -1
; Cel-shading outline distance, at least this (the game: 6000).
MinStageEdgeBaseDistance = 6000
; Skits at your screen's resolution.
CutsceneRenderFix = true
; Cutscenes at your frame rate.
CutsceneAllowSubframes = true
; Skit resolution in percent (with CutsceneRenderFix).
CutsceneScreenPercentage = 100
; Upscale filtering for skit panels (needs r.Upscale.Quality 5).
CutsceneForceUpscaleFiltering = false
; Keep these three as they are: RenoDX's DLAA / DLSS needs the game's TAA and turns its jitter on by itself.
OverrideTAAJitterScale = -1
OverrideTAASharpness = -1
UseUE4TAA = false

[Patches]
; Skips the intro logos.
SkipIntroLogos = false
; Turns off chromatic aberration in cutscenes. Keep false: RenoDX HDR's Chromatic Aberration slider does this.
DisableCutsceneCA = false
; Stops the game switching to 720p fullscreen at start (needs an r.SetRes line in Engine.ini).
EnableResolutionFix = false
