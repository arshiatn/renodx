; Arise-SDK settings for the RenoDX Tales of Arise addons (HDR, DLAA, graphics presets).
; Arise-SDK: https://github.com/emoose/Arise-SDK - put its xinput1_3.dll and this file next to
; "Tales of Arise.exe" (Arise\Binaries\Win64). Every option is explained in the Arise-SDK.ini that comes with it.

[Graphics]
; Only needed for skipping the intro logos: the RenoDX DLAA + Graphics addon has the other settings too
; (Graphics > Characters, Cutscenes, Distance and detail), so they are left to the addon here. Monster distance,
; character detail and outline distance then set Arise-SDK's own live values.
MinimumNPCDistance = -1
MonsterDistanceMultiplier = 1
CharaLODMultiplier = 1
DisableUpdateRateOptimization = false
MinStageEdgeBaseDistance = 6000
; Only Arise-SDK's own while it is installed (the addon's "Never hide characters" works without it): keeps
; off-screen characters drawn (and audible), costs a lot of FPS.
CharaDisableCull = false
; The game's own sharpening filters (-1: the game's).
OverrideCharaSharpenFilterStrength = -1
OverrideStageSharpenFilterStrength = -1
; Sharp skits: the addon's (Graphics > Cutscenes).
CutsceneRenderFix = false
CutsceneScreenPercentage = 100
CutsceneForceUpscaleFiltering = false
; Smooth cutscenes: only Arise-SDK's own while it is installed (the addon's works without it).
CutsceneAllowSubframes = true
; Keep these three as they are: RenoDX's DLAA hooks the game's own TAA (UseUE4TAA false) and turns the camera
; jitter on by itself while DLAA runs (-1: the game's).
OverrideTAAJitterScale = -1
OverrideTAASharpness = -1
UseUE4TAA = false

[Patches]
SkipIntroLogos = true
; Cutscene chromatic aberration as the game has it (RenoDX HDR's Chromatic Aberration slider scales it).
DisableCutsceneCA = false
EnableResolutionFix = false
